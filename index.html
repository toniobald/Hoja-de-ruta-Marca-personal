/* ---------- Mascota de Soltar: unos ojos que miran donde tocas, parpadean y curiosean mientras ordena ---------- */
var MC={raf:0,x:0,y:0,tx:0,ty:0,vx:0,vy:0,blink:0,nextBlink:0,glanceAt:0};
function mascotLoop(now){
  var L=document.getElementById("mcL"),R=document.getElementById("mcR");
  if(!L||!R){MC.raf=0;return;}
  var tx=MC.tx,ty=MC.ty;
  if(dumpPend()&&now>MC.glanceAt){
    var a=Math.random()*6.283,f=.45+Math.random()*.4;
    MC.gx=Math.cos(a)*f;MC.gy=Math.sin(a)*f*.7;MC.glanceAt=now+700+Math.random()*900;
  }
  if(dumpPend()){tx=MC.gx||0;ty=MC.gy||0;}
  MC.vx+=((tx-MC.x)*.1-MC.vx*.34);MC.vy+=((ty-MC.y)*.1-MC.vy*.34);
  MC.x+=MC.vx;MC.y+=MC.vy;
  if(now>MC.nextBlink){MC.blink=now;MC.nextBlink=now+2600+Math.random()*3200;}
  var since=now-MC.blink,lid=since<160?1-.9*Math.sin(since/160*Math.PI):1;
  var cx=Math.max(-.9,Math.min(.9,MC.x)),cy=Math.max(-.9,Math.min(.9,MC.y));
  [[L,-15],[R,15]].forEach(function(e){
    var side=e[1]<0?-1:1,near=1-Math.max(0,cx*side)*.35,k=.85+.15*near;
    var px=50+e[1]*(1-Math.abs(cx)*.25)+cx*20,py=50+cy*17;
    e[0].setAttribute("transform","translate("+px.toFixed(2)+" "+py.toFixed(2)+") scale("+(k*(1-Math.max(0,cx*side)*.18)).toFixed(3)+" "+(k*lid).toFixed(3)+")");
  });
  MC.raf=requestAnimationFrame(mascotLoop);
}
function mascotStart(){
  if(!document.getElementById("mascot"))return;
  if(RM){
    var L=document.getElementById("mcL"),R=document.getElementById("mcR");
    if(L)L.setAttribute("transform","translate(35 50)");
    if(R)R.setAttribute("transform","translate(65 50)");
    return;
  }
  if(!MC.raf)MC.raf=requestAnimationFrame(mascotLoop);
}
document.addEventListener("pointermove",function(e){
  var m=document.getElementById("mascot");
  if(!m)return;
  var r=m.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.tanh(d/160)*.85;
  MC.tx=dx/d*k;MC.ty=dy/d*k;
},{passive:true});
document.addEventListener("pointerdown",function(e){
  var m=document.getElementById("mascot");
  if(!m)return;
  var r=m.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.tanh(d/160)*.85;
  MC.tx=dx/d*k;MC.ty=dy/d*k;
},{passive:true});
/* ---------- Anillo de tomas (inicio): 60 marcas, onda viajera y cometa en la cabeza ---------- */
var DIAL={f:0,sp:null,raf:0,t:0,ok:false};
function dialTarget(){var t=allTotal();return t?allDone()/t:0;}
function dialPaint(now){
  var svg=document.querySelector("#heroDial .hd-svg");
  if(!svg){DIAL.raf=0;return;}
  var N=60,f=Math.max(0,Math.min(1,DIAL.f)),i,ln,tf,on,behind,comet,und,len,a,cs,sn,lit;
  if(svg.childNodes.length!==N){
    var h="";for(i=0;i<N;i++)h+='<line stroke-linecap="round" stroke-width="2.4"></line>';
    svg.innerHTML=h;
  }
  DIAL.t+=RM?0:.055;
  for(i=0;i<N;i++){
    ln=svg.childNodes[i];tf=i/(N-1);on=f>0&&tf<=f+.001;behind=f-tf;
    comet=on&&behind<.14?(1-behind/.14)*8:0;
    und=on&&!RM?Math.sin(DIAL.t+i*.5)*(1+f*2.6):0;
    len=(on?24:21)+comet+und;
    a=(120+tf*300)*Math.PI/180;cs=Math.cos(a);sn=Math.sin(a);
    ln.setAttribute("x1",100+cs*60);ln.setAttribute("y1",100+sn*60);
    ln.setAttribute("x2",100+cs*(60+len));ln.setAttribute("y2",100+sn*(60+len));
    ln.style.stroke=on?"var(--accent)":"currentColor";
    ln.style.strokeOpacity=on?(.42+(1-Math.max(0,Math.min(1,behind)))*.58):.22;
  }
  DIAL.raf=(RM||document.hidden)?0:requestAnimationFrame(dialPaint);
}
function dialStart(){
  if(!document.querySelector("#heroDial"))return;
  S.ui.rv=S.ui.rv||{};
  var from=S.ui.rv.dial,to=dialTarget();
  if(DIAL.sp)DIAL.sp.stop();
  DIAL.f=(from===undefined||RM)?to:from;
  DIAL.sp=new Spring(DIAL.f,.8,.7,function(v){DIAL.f=v;});
  if(!RM)DIAL.sp.to(to);else DIAL.f=to;
  S.ui.rv.dial=to;putJSON(UKEY,S.ui);
  if(!DIAL.raf)DIAL.raf=requestAnimationFrame(dialPaint);
}
function dialTo(){
  if(!DIAL.sp||!document.querySelector("#heroDial"))return;
  var to=dialTarget();S.ui.rv=S.ui.rv||{};S.ui.rv.dial=to;
  if(RM)DIAL.f=to;else DIAL.sp.to(to);
  if(!DIAL.raf)DIAL.raf=requestAnimationFrame(dialPaint);
}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!DIAL.raf&&document.querySelector("#heroDial"))DIAL.raf=requestAnimationFrame(dialPaint);});

/* ---------- Acordeón de fases: la abierta toma espacio y las vecinas ceden con caída suave ---------- */
function accSet(i){
  var cs=$$("#acc .acc-c");
  cs.forEach(function(c,j){
    var d=Math.abs(j-i),g=1+2.6*Math.exp(-Math.pow(d/.7,2));
    c.style.flexGrow=String(g);
    if(j===i)c.setAttribute("data-open","");else c.removeAttribute("data-open");
  });
}
function accInit(){
  if(!document.getElementById("acc"))return;
  var i=S.ui.acc;
  if(typeof i!=="number"||i<0||i>=PHASES.length){
    i=0;PHASES.forEach(function(p,k){if(p.id===currentPhase())i=k;});
  }
  S.ui.acc=i;accSet(i);
}
/* Destello de cámara al cerrar una fase */
function flash(){
  SFX.win();
  if(RM)return;
  phaseDots();
  var f=document.createElement("i");
  f.className="flash";document.body.appendChild(f);
  var a=f.animate([{opacity:0},{opacity:.85,offset:.12},{opacity:0}],{duration:620,easing:"cubic-bezier(.2,.7,.2,1)"});
  a.onfinish=function(){f.remove();};
}
/* Timecode de la claqueta: 24 fotogramas por segundo */
(function(){
  var t0=performance.now(),last=-1,el=null;
  function p2(n){return n<10?"0"+n:""+n;}
  function loop(now){
    el=document.getElementById("tc");
    if(el&&!document.hidden){
      var fr=Math.floor((now-t0)/1000*24);
      if(fr!==last){
        last=fr;
        var f=fr%24,s=Math.floor(fr/24),m=Math.floor(s/60),h=Math.floor(m/60);
        el.textContent=p2(h)+":"+p2(m%60)+":"+p2(s%60)+":"+p2(f);
      }
    }
    requestAnimationFrame(loop);
  }
  if(!RM)requestAnimationFrame(loop);
})();


if(!VIEWS[S.ui.tab])S.ui.tab="inicio";
if(PHASES.length&&!phaseById(S.ui.phase))S.ui.phase=PHASES[0].id;
S.ui.sub="soltar";S.ui.gedit=false;
if(S.ui.dsub!=="racha"&&S.ui.dsub!=="publicado")S.ui.dsub="racha";
if(!S.scripts[S.ui.video]){var fi=filledIds();S.ui.video=fi.length?fi[0]:1;}
(function(){var hh=String(location.hash||"").replace("#","");if(VIEWS[hh]){S.ui.tab=hh;}})();
if("serviceWorker" in navigator){navigator.serviceWorker.addEventListener("message",function(e){var tb=e.data&&e.data.tab;if(tb&&VIEWS[tb])show(tb,true);});}
if(CONTENT&&PHASES.length){show(S.ui.tab,false,0);}else{showConnect();}
if(CONN){
  sync().then(watchDumps);
  window.addEventListener("online",function(){if(localStorage.getItem(PKEY))push();else sync();});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!pushing)sync();});
}

})();
