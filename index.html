<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sofrito</title>
<meta name="theme-color" content="#05080B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEE5D4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sofrito">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Concepto: claqueta y tira de película. Oscuro por defecto (sala de montaje), papel de guion en claro.
   La claqueta es siempre negra: es un objeto. Un solo acento (azul).
   Rojo, amarillo y blanco aparecen solo en las rayas de la claqueta, el confeti y la leyenda del guion.
   Radios: superficies 18px, controles 12px, botones y chips en píldora, fotogramas 8px. */
:root{
  --bg:#05080B; --bg-2:#0A1014; --surface:#0E161B; --surface-2:#142027; --surface-hi:#1A2931;
  --ink:#F4EFE6; --muted:#8FA3A8; --line:rgba(190,230,230,.13); --line-soft:rgba(190,230,230,.07); --hl:rgba(255,236,214,.08);
  --accent:#FF8340; --accent-ink:#1C0B02; --accent-text:#FFA971; --accent-soft:rgba(255,131,64,.16);
  --c-blue:#52D6C8; --c-red:#FF6079; --c-yellow:#F6CB4E; --c-plain:#D3CCBF;
  --blue-soft:rgba(82,214,200,.15); --red-soft:rgba(255,96,121,.15); --yel-soft:rgba(246,203,78,.14); --plain-soft:rgba(211,204,191,.12);
  --slate:#020507; --slate-ink:#F4EFE6; --slate-line:rgba(255,236,214,.17); --tick:#FF8340;
  --strip:#03070A; --hole:rgba(255,236,214,.18);
  --teal:#1FB8AA; --ember:#FF8340; --gold:#F6CB4E; --rose:#FF6079; --paper:#F4EFE6; --ink-deep:#020507;
  --shadow:0 22px 44px -22px rgba(0,0,0,.8); --grain:.075; --glass:rgba(12,20,25,.7);
  --leak-a:rgba(31,184,170,.22); --leak-b:rgba(255,131,64,.16);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Geist","Segoe UI",system-ui,Arial,sans-serif;
  --f-mono:"Geist Mono",Consolas,"Courier New",monospace;
  --r:18px; --r-sm:12px; --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEE5D4; --bg-2:#E5DAC5; --surface:#FBF6EB; --surface-2:#F3EADA; --surface-hi:#FFFDF8;
    --ink:#17120C; --muted:#675D4E; --line:rgba(40,28,10,.16); --line-soft:rgba(40,28,10,.08); --hl:rgba(255,255,255,.9);
    --accent:#C9461A; --accent-ink:#FFFFFF; --accent-text:#B03A10; --accent-soft:rgba(201,70,26,.10);
    --c-blue:#0B7A74; --c-red:#B3223D; --c-yellow:#7A5800; --c-plain:#675D4E;
    --blue-soft:rgba(11,122,116,.11); --red-soft:rgba(179,34,61,.10); --yel-soft:rgba(160,120,0,.16); --plain-soft:rgba(103,93,78,.12);
    --strip:#D8CBB0; --hole:rgba(40,28,10,.30); --tick:#FF8340;
    --shadow:0 20px 38px -22px rgba(70,40,10,.34); --grain:.05; --glass:rgba(251,246,235,.78);
    --leak-a:rgba(31,184,170,.16); --leak-b:rgba(255,131,64,.20);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEE5D4; --bg-2:#E5DAC5; --surface:#FBF6EB; --surface-2:#F3EADA; --surface-hi:#FFFDF8;
  --ink:#17120C; --muted:#675D4E; --line:rgba(40,28,10,.16); --line-soft:rgba(40,28,10,.08); --hl:rgba(255,255,255,.9);
  --accent:#C9461A; --accent-ink:#FFFFFF; --accent-text:#B03A10; --accent-soft:rgba(201,70,26,.10);
  --c-blue:#0B7A74; --c-red:#B3223D; --c-yellow:#7A5800; --c-plain:#675D4E;
  --blue-soft:rgba(11,122,116,.11); --red-soft:rgba(179,34,61,.10); --yel-soft:rgba(160,120,0,.16); --plain-soft:rgba(103,93,78,.12);
  --strip:#D8CBB0; --hole:rgba(40,28,10,.30); --tick:#FF8340;
  --shadow:0 20px 38px -22px rgba(70,40,10,.34); --grain:.05; --glass:rgba(251,246,235,.78);
  --leak-a:rgba(31,184,170,.16); --leak-b:rgba(255,131,64,.20);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);-webkit-text-size-adjust:100%;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 520px at 50% -140px,rgba(255,255,255,.07),transparent 70%)}
:root[data-theme="light"] body::before{background:radial-gradient(900px 520px at 50% -140px,rgba(255,255,255,.9),transparent 70%)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) body::before{background:radial-gradient(900px 520px at 50% -140px,rgba(255,255,255,.9),transparent 70%)}}
.grain{position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:var(--grain);mix-blend-mode:overlay;background-size:160px 160px}
@media (prefers-reduced-motion:no-preference){.grain{animation:flicker .9s steps(6) infinite}}
@keyframes flicker{0%{transform:translate(0,0)}17%{transform:translate(-3%,2%)}33%{transform:translate(2%,-3%)}50%{transform:translate(-2%,-1%)}67%{transform:translate(3%,3%)}83%{transform:translate(-1%,2%)}100%{transform:translate(0,0)}}

h1,h2,h3,h4{font-family:var(--f-body);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent-text)}
mark{color:inherit;background:linear-gradient(transparent 56%,rgba(246,203,78,.5) 56% 94%,transparent 94%);padding:0 .08em}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px}
button:active{transform:scale(.97)}
button{transition:transform .12s var(--ease),background-color .2s,border-color .2s,color .2s,opacity .2s}
.surf{background:linear-gradient(180deg,var(--surface-hi),var(--surface));border:1px solid var(--line);border-radius:var(--r);
  box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}

/* Estructura: dock flotante en móvil, columna lateral en escritorio */
.app{position:relative;z-index:1;min-height:100dvh;display:block}
.main{width:100%;max-width:840px;margin-inline:auto;padding:22px 16px 140px;transform-origin:50% 0}
.nav{position:fixed;left:12px;right:12px;max-width:520px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;
  display:flex;gap:2px;padding:6px;border-radius:26px;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 20px 44px -14px rgba(0,0,0,.6),inset 0 1px 0 var(--hl)}
@supports (backdrop-filter:blur(1px)){
  .nav{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
}
@media (prefers-reduced-transparency:reduce){.nav{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
.brand{display:none}
.nav .ind{position:absolute;left:0;top:0;width:0;height:0;border-radius:20px;background:var(--accent);z-index:0;pointer-events:none;will-change:transform,width,height}
.nav button{position:relative;z-index:1;flex:1;min-height:50px;border:0;background:none;color:var(--muted);border-radius:20px;
  font:600 .82rem/1.1 var(--f-body);display:grid;place-items:center;padding:6px 2px}
.nav button[aria-current="page"]{color:var(--accent-ink)}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:248px minmax(0,1fr)}
  .nav{position:sticky;top:0;left:auto;right:auto;max-width:none;margin:0;height:100dvh;flex-direction:column;justify-content:flex-start;gap:6px;
    padding:30px 16px;border-radius:0;border:0;border-right:1px solid var(--line);box-shadow:none;background:var(--bg-2)}
  .brand{display:block;padding:0 12px 26px;font:900 2.3rem/.88 var(--f-display);text-transform:uppercase;letter-spacing:.005em}
  .brand small{display:block;margin-top:10px;font:500 .72rem var(--f-mono);letter-spacing:.08em;color:var(--muted)}
  .nav .ind{border-radius:14px}
  .nav button{flex:none;display:flex;align-items:center;justify-content:flex-start;min-height:48px;padding:0 14px;font-size:1rem;border-radius:14px}
  .main{padding:44px 48px 90px}
}

/* Paneles y titulares */
.panel-head{margin-bottom:18px}
.big-h{font:900 clamp(2.8rem,13vw,4.6rem)/.9 var(--f-display);text-transform:uppercase;letter-spacing:.005em}
.panel-head p{color:var(--muted);margin-top:10px;max-width:56ch}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding-top:.2em;margin-top:-.2em;padding-bottom:.04em}
.wi{display:inline-block}

/* Inicio: claqueta */
.slate-wrap{perspective:1000px;padding-top:40px}
.slate{position:relative;transform-style:preserve-3d;will-change:transform;cursor:pointer;-webkit-user-select:none;user-select:none}
.stick{position:relative;z-index:2;height:36px;border-radius:12px 12px 4px 4px;transform-origin:7% 100%;margin-bottom:-3px;
  background:repeating-linear-gradient(-60deg,#F4EFE6 0 24px,#1FB8AA 24px 48px,#F4EFE6 48px 72px,#FF6079 72px 96px,#F4EFE6 96px 120px,#F6CB4E 120px 144px);
  box-shadow:inset 0 0 0 2px #020507,0 10px 24px -8px rgba(0,0,0,.65)}
.board{position:relative;background:var(--slate);color:var(--slate-ink);border-radius:4px 4px var(--r) var(--r);padding:18px 18px 14px;
  border:1px solid var(--slate-line);box-shadow:0 30px 60px -26px rgba(0,0,0,.8)}
.board small{display:block;font:500 .68rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(244,245,248,.6)}
.sl-title{margin:6px 0 0;font:900 clamp(2.5rem,12.5vw,4.4rem)/.88 var(--f-display);text-transform:uppercase;letter-spacing:.005em}
.sl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;border-top:1px solid var(--slate-line);border-bottom:1px solid var(--slate-line)}
.sl-grid > div{padding:10px 12px;border-left:1px solid var(--slate-line)}
.sl-grid > div:first-child{border-left:0;padding-left:0}
.sl-grid b{display:block;margin-top:2px;font:800 clamp(1.3rem,5.6vw,1.9rem)/1 var(--f-display);text-transform:uppercase;font-variant-numeric:tabular-nums}
.ticks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px}
.tg{display:flex;gap:3px;padding:8px 2px;min-height:40px;border:0;background:none;align-items:center}
.tg i{display:block;width:5px;height:22px;border-radius:2px;background:rgba(255,255,255,.17);transform-origin:50% 100%}
.tg i.on{background:var(--tick);animation:tickpop .6s var(--spring) both;animation-delay:calc(var(--i,0)*16ms)}
@keyframes tickpop{0%{transform:scaleY(.3)}55%{transform:scaleY(1.35)}100%{transform:none}}
.manifesto{margin-top:22px;font:600 clamp(1.15rem,3.6vw,1.5rem)/1.35 var(--f-body);max-width:30ch;text-wrap:balance}

.next{position:relative;isolation:isolate;overflow:hidden;margin-top:22px;border-radius:var(--r);padding:20px 20px 24px;color:var(--accent-ink);
  background:linear-gradient(104deg,transparent 40%,rgba(255,244,230,.5) 50%,transparent 60%) -140% 0/260% 100% no-repeat,linear-gradient(140deg,#FFA062,#F0622A 55%,#D94A1C);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 26px 48px -22px rgba(255,100,40,.55);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.next::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;z-index:1;
  background:linear-gradient(90deg,#F4EFE6 0 25%,#020507 25% 50%,#FF6079 50% 75%,#F6CB4E 75%)}
.nx-n{font:900 clamp(4.5rem,24vw,7rem)/.78 var(--f-display);color:transparent;-webkit-text-stroke:2px rgba(28,11,2,.55);font-variant-numeric:tabular-nums}
.next small{display:block;font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.next p{margin:6px 0 14px;font:600 1.1rem/1.35 var(--f-body)}

.btn{min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;color:var(--ink)}
.btn.primary,.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.next .btn{background:#1C0B02;color:#FFC9A3;border-color:transparent}
.btn.quiet{background:none;color:var(--muted);border-color:transparent}
.btn:disabled{opacity:.4}

.sect{margin-top:36px}
.sect > h3{font:900 clamp(1.8rem,7vw,2.4rem)/.95 var(--f-display);text-transform:uppercase;margin-bottom:14px}
.story{list-style:none;margin:0;padding:0}
.beat{width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:start;text-align:left;
  background:none;border:0;padding:0 0 22px;position:relative;isolation:isolate}
.bn{position:relative;font:900 3.2rem/.8 var(--f-display);color:transparent;-webkit-text-stroke:1.5px var(--muted);text-align:center;
  font-variant-numeric:tabular-nums;transition:color .4s,-webkit-text-stroke-color .4s}
.bn.done{color:var(--accent-text);-webkit-text-stroke-color:var(--accent-text)}
.story li:not(:last-child) .bn::after{content:"";position:absolute;left:50%;top:calc(100% + 8px);height:calc(100% + 6px);width:1px;background:var(--line)}
.beat b{display:block;font:700 1.08rem/1.25 var(--f-body)}
.beat .d{display:block;color:var(--muted);font-size:.93rem;line-height:1.4;margin-top:2px}
.frac{font:500 .82rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.frac.done{color:var(--accent-text)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;isolation:isolate;overflow:hidden;text-align:left;padding:16px;min-height:112px;display:grid;align-content:space-between;gap:10px;
  background:linear-gradient(180deg,var(--surface-hi),var(--surface));border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hl)}
.tile b{font:900 1.7rem/.9 var(--f-display);text-transform:uppercase}
.tile span{color:var(--muted);font-size:.9rem;line-height:1.35}
.sources{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.src{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-height:60px}
.src b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 .95rem var(--f-mono);color:var(--accent-ink);background:var(--accent)}
.fine{color:var(--muted);font-size:.9rem;margin-top:12px;max-width:62ch}

/* Tira de película: selector de fases */
.strip{overflow-x:auto;margin:0 -16px 20px;padding:0 16px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.track{position:relative;display:inline-flex;gap:8px;min-width:100%;padding:24px 12px;background:var(--strip);border-radius:6px}
.track::before,.track::after{content:"";position:absolute;left:0;right:0;height:9px;
  background:repeating-linear-gradient(90deg,var(--hole) 0 9px,transparent 9px 20px);background-position:6px 0}
.track::before{top:7px}.track::after{bottom:7px}
.track .bx{position:absolute;left:0;top:0;width:0;height:0;border-radius:8px;background:var(--accent);z-index:0;pointer-events:none;will-change:transform,width,height;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.frame{position:relative;z-index:1;flex:none;width:78px;height:92px;scroll-snap-align:center;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
  display:grid;grid-template-rows:1fr auto auto;justify-items:center;padding:8px 4px 8px;gap:0}
.frame .fn{align-self:center;font:900 2.4rem/.9 var(--f-display);font-variant-numeric:tabular-nums}
.frame .fl{font:600 .72rem var(--f-body)}
.frame .frac{font-size:.7rem;padding-top:1px}
.frame.done .fn{color:var(--accent-text)}
.frame[aria-pressed="true"]{background:transparent;border-color:transparent;color:var(--accent-ink)}
.frame[aria-pressed="true"] .fn,.frame[aria-pressed="true"] .frac{color:var(--accent-ink)}

/* Teoría */
.swipe{position:relative;isolation:isolate;touch-action:pan-y;will-change:transform}
.swipe.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.wmw{position:absolute;inset:0 -16px auto -16px;height:360px;overflow:hidden;pointer-events:none;z-index:-1}
.wm{position:absolute;right:6px;top:-26px;font:900 clamp(15rem,70vw,24rem)/.8 var(--f-display);color:transparent;-webkit-text-stroke:2px var(--line);font-variant-numeric:tabular-nums}
.ph-head{padding-top:6px}
.kick{font:500 .75rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.ph-title{margin-top:8px;font:900 clamp(2.6rem,12.5vw,4.6rem)/.88 var(--f-display);text-transform:uppercase;letter-spacing:.005em;max-width:12ch}
.goal{color:var(--muted);max-width:60ch;margin-top:14px}
.block{padding-block:24px;border-top:1px solid var(--line);margin-top:24px}
.block:first-of-type{margin-top:22px}
.block h3{font:700 1.12rem/1.3 var(--f-body)}
.block h3 small{font:400 .9rem var(--f-body);color:var(--muted)}
.teach{list-style:none;counter-reset:t;padding:0;margin:14px 0 0;display:grid;gap:0}
.teach li{counter-increment:t;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line-soft);max-width:68ch}
.teach li:first-child{border-top:0}
.teach li::before{content:counter(t,decimal-leading-zero);font:500 .78rem var(--f-mono);color:var(--accent-text);padding-top:.32em}
.teach li b{font-weight:650}
.steps{list-style:none;counter-reset:s;padding:0;margin:14px 0 0;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;max-width:68ch}
.steps li::before{content:counter(s);font:900 2rem/1 var(--f-display);color:var(--accent-ink);background:var(--accent);border-radius:var(--r-sm);height:44px;display:grid;place-items:center}
.ts{font:500 .72rem var(--f-mono);text-decoration:none;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 8px;margin-left:3px;color:var(--accent-text);background:var(--surface-2)}
.ts::before{content:"";display:inline-block;border:4px solid transparent;border-left:6px solid currentColor;border-right:0;margin-right:5px;vertical-align:0}
.ts:hover{border-color:var(--accent-text)}
.note{color:var(--muted);font-size:.93rem;margin-top:20px;max-width:66ch}
.callout{position:relative;margin-top:34px;padding:22px 18px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--accent-soft);max-width:72ch}
.callout b.t{position:absolute;top:-13px;left:14px;padding:3px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.callout.err{background:var(--red-soft)}
.callout.err b.t{background:var(--c-red);color:#fff}
.pair{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}

/* Hacer */
.counter{display:flex;align-items:baseline;gap:14px;margin-top:6px}
.cn{font:900 clamp(4.5rem,24vw,7.5rem)/.8 var(--f-display);font-variant-numeric:tabular-nums}
.cn i{font-style:normal;color:var(--muted)}
.cl{font:500 .78rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hfase{font:700 1.15rem/1.3 var(--f-body);margin-top:14px}
.segs{display:flex;gap:5px;margin-top:14px}
.segs i{flex:1;height:10px;border-radius:3px;background:var(--line);transform-origin:50% 100%;transition:background-color .35s}
.segs i.on{background:var(--accent);animation:tickpop .6s var(--spring) both}
.takes{margin-top:22px;padding:4px 16px}
.take{position:relative;overflow:hidden;display:grid;grid-template-columns:28px 24px minmax(0,1fr);gap:12px;padding:16px 0;border-top:1px solid var(--line-soft);cursor:pointer;min-height:56px;align-items:start}
.take:first-child{border-top:0}
.take input,.task input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:28px;height:28px;border-radius:9px;border:2px solid var(--muted);display:block;position:relative;margin-top:1px;transition:background-color .15s,border-color .15s,transform .15s var(--ease)}
.box::after{content:"";position:absolute;left:8px;top:2px;width:8px;height:14px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);transition:transform .22s var(--ease)}
.take input:checked + .box,.task input:checked + .box{background:var(--accent);border-color:var(--accent)}
.take input:checked + .box::after,.task input:checked + .box::after{transform:rotate(45deg) scale(1)}
.take input:focus-visible + .box,.task input:focus-visible + .box{outline:2px solid var(--accent-text);outline-offset:3px}
.ti{font:500 .74rem var(--f-mono);color:var(--muted);padding-top:.5em}
.tx{min-width:0;transition:color .2s}
.take input:checked ~ .tx,.task input:checked ~ .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.take::after{content:"";position:absolute;inset:0;background:var(--accent-soft);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--spring);z-index:-1}
.take:has(input:checked)::after{transform:scaleX(1)}
.task{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;cursor:pointer;align-items:start}
.empty{padding:22px 4px;color:var(--muted)}

/* Escribir */
.seg{position:relative;display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin:18px 0;max-width:100%}
.seg .bx{position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;background:var(--accent);z-index:0;pointer-events:none;will-change:transform,width,height}
.seg button{position:relative;z-index:1;min-height:42px;padding:0 22px;border:0;border-radius:999px;background:none;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--accent-ink)}
.form{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=password],textarea,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);padding:10px 14px;font:inherit;line-height:1.4}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:none;overflow:hidden;field-sizing:content;min-height:48px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 14px}
.tag{font:600 .72rem var(--f-mono);letter-spacing:.04em;border-radius:999px;padding:4px 11px;display:inline-block}
.t-plain{color:var(--c-plain);background:var(--plain-soft)}
.t-blue{color:var(--c-blue);background:var(--blue-soft)}
.t-red{color:var(--c-red);background:var(--red-soft)}
.t-yellow{color:var(--c-yellow);background:var(--yel-soft)}
.rows{display:grid;gap:10px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;display:grid;gap:8px}
.srow .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.srow select{width:auto;min-height:40px;font:600 .74rem var(--f-mono);letter-spacing:.04em;border:0;padding:6px 12px;border-radius:999px}
.srow textarea{font-family:var(--f-mono);font-size:.95rem;line-height:1.55;background:transparent;border-color:var(--line-soft)}
.srow .acts{display:flex;gap:4px}
.ico{min-width:40px;min-height:40px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);font-size:1rem;color:var(--muted)}
.ico:disabled{opacity:.35;cursor:default}
.adds{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.adds .btn{min-height:42px;padding:0 14px;font-size:.88rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.msg{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.fallback{margin-top:12px}
.fallback textarea{min-height:140px;font-family:var(--f-mono);font-size:.85rem;overflow:auto}
.idea{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.idea.chosen{background:linear-gradient(180deg,var(--accent-soft),var(--surface));border-color:var(--accent)}
.idea .why{color:var(--muted);font-size:.93rem}
.idea .acts{display:flex;gap:8px;flex-wrap:wrap}
.idea .acts .btn{min-height:42px;padding:0 16px;font-size:.88rem}
.stamp{position:absolute;right:14px;top:12px;transform:rotate(-7deg);border:2px solid var(--accent-text);color:var(--accent-text);
  font:900 1rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:4px 9px 3px;border-radius:6px;animation:stampin .5s var(--spring) both}
@keyframes stampin{0%{transform:rotate(-16deg) scale(1.9);opacity:0}100%{transform:rotate(-7deg) scale(1);opacity:1}}
.idea .ti2{padding-right:96px}
.list{display:grid;gap:10px;margin-top:16px}
.count{font:500 .8rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-top:22px;color:var(--muted)}

/* Plan */
.weeks{display:grid;gap:12px}
.week{position:relative;isolation:isolate;overflow:hidden;padding:20px 18px 14px;display:grid;gap:12px;
  background:linear-gradient(180deg,var(--surface-hi),var(--surface));border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.wk-n{position:absolute;right:-6px;top:-22px;z-index:-1;font:900 11rem/.8 var(--f-display);color:transparent;-webkit-text-stroke:2px var(--line);pointer-events:none}
.week h3{font:900 2.3rem/.9 var(--f-display);text-transform:uppercase}
.week p{max-width:46ch}
.week .res{color:var(--muted);font-size:.93rem}
.week .fases{display:flex;flex-wrap:wrap;gap:6px}
.week .fases button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font:500 .78rem var(--f-mono);color:var(--accent-text)}
.week.done{border-color:var(--accent)}
.week.done::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--accent-soft)}

/* Barra superior (título que se compacta al desplazarse) */
.topbar{position:fixed;top:0;left:0;right:0;z-index:15;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  background:var(--surface);border-bottom:1px solid var(--line);font:900 1.3rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;
  transform:translateY(-110%);opacity:0;pointer-events:none;transition:transform .6s var(--spring),opacity .25s}
@supports (backdrop-filter:blur(1px)){
  .topbar{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
}
.topbar.on{transform:none;opacity:1}
@media (min-width:900px){.topbar{left:248px}}

/* Hoja inferior */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(2,5,7,.66);opacity:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin-inline:auto;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -14px 52px rgba(0,0,0,.45),inset 0 1px 0 var(--hl);transform:translateY(100%);will-change:transform}
.grab{touch-action:none;cursor:grab;padding:10px 0 16px;display:grid;justify-items:center;gap:12px}
.grab:active{cursor:grabbing}
.grab .handle{width:42px;height:5px;border-radius:999px;background:var(--line)}
.grab h3{justify-self:start;font:900 1.9rem/.9 var(--f-display);text-transform:uppercase}
.sheet .tools{margin-top:18px}

/* Aviso y confeti */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:50;max-width:calc(100vw - 32px);
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;font-size:.95rem;box-shadow:0 14px 34px rgba(0,0,0,.4)}
@media (min-width:900px){.toast{bottom:32px}}
.pt{position:fixed;z-index:95;border-radius:2px;pointer-events:none}

/* Estado de sincronización */
.sync{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:60;padding:6px 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font:500 .72rem var(--f-mono);color:var(--muted);
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .5s var(--spring)}
.sync.on{opacity:1;transform:none}
.sync.bad{border-color:var(--c-red);color:var(--c-red)}

/* Foco de luz del puntero (solo ratón) */
@media (hover:hover){
  .beat::before,.tile::before,.week::before,.src::before{content:"";position:absolute;inset:-4px;z-index:-1;opacity:0;transition:opacity .3s;border-radius:var(--r);
    background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),var(--accent-soft),transparent 70%)}
  .beat:hover::before,.tile:hover::before,.week:hover::before,.src:hover::before{opacity:1}
  .next::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
    background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 70%)}
  .next:hover::before{opacity:1}
}

/* Aparición al desplazarse y paralaje (progresivo, sin JS) */
@supports (animation-timeline:view()){
  @media (prefers-reduced-motion:no-preference){
    .teach li,.steps li,.week,.idea,.srow,.src,.tile,.beat,.strk,.note,.goal,.fine,.sect > p,.block > h3,.pair{animation:scrollin linear both;animation-timeline:view();animation-range:entry 0% entry 80%}
    .callout{animation:calloutin linear both;animation-timeline:view();animation-range:entry 0% entry 85%}
    .callout b.t{animation:tagin linear both;animation-timeline:view();animation-range:entry 20% entry 100%}
    .sect > h3::after,.block > h3::after{animation:linein linear both;animation-timeline:view();animation-range:entry 10% entry 90%}
    mark{background-repeat:no-repeat;background-size:0% 100%;animation:markin linear both;animation-timeline:view();animation-range:entry 30% entry 100%}
    .steps li::before{animation:numin linear both;animation-timeline:view();animation-range:entry 0% entry 70%}
    .wm{animation:wmove linear both;animation-timeline:scroll(root block);animation-range:0 900px}
  }
}
/* Subrayado que se dibuja bajo los titulares de sección */
.sect > h3::after,.block > h3::after{content:"";display:block;width:56px;height:3px;margin-top:10px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--c-yellow));transform-origin:0 50%}
@keyframes linein{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes calloutin{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes tagin{from{transform:translateY(8px) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes markin{from{background-size:0% 100%}to{background-size:100% 100%}}
@keyframes numin{from{transform:scale(.6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes scrollin{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes wmove{from{transform:translateY(0)}to{transform:translateY(120px)}}


/* ===== Capa cinematográfica ===== */
.leaks{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.leaks i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;will-change:transform}
.leaks i:nth-child(1){left:-45vmax;top:-50vmax;background:radial-gradient(closest-side,var(--leak-a),transparent)}
.leaks i:nth-child(2){right:-50vmax;bottom:-55vmax;background:radial-gradient(closest-side,var(--leak-b),transparent)}
.leaks i:nth-child(3){left:20vw;top:30vh;width:60vmax;height:60vmax;background:radial-gradient(closest-side,rgba(246,203,78,.07),transparent)}
@media (prefers-reduced-motion:no-preference){
  .leaks i:nth-child(1){animation:leak1 46s ease-in-out infinite alternate}
  .leaks i:nth-child(2){animation:leak2 58s ease-in-out infinite alternate}
  .leaks i:nth-child(3){animation:leak1 70s ease-in-out infinite alternate-reverse}
}
@keyframes leak1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(14vw,10vh,0) scale(1.18)}}
@keyframes leak2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-16vw,-8vh,0) scale(.92)}}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,4,8,.5) 100%)}
:root[data-theme="light"] .vig{background:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(90,50,10,.16) 100%)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .vig{background:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(90,50,10,.16) 100%)}}

/* Hilo de progreso de lectura, arriba */
.prog{position:fixed;left:0;right:0;top:0;height:2px;z-index:70;pointer-events:none;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--c-blue),var(--accent) 55%,var(--c-yellow))}
@supports (animation-timeline:scroll()){
  @media (prefers-reduced-motion:no-preference){.prog{animation:progx linear both;animation-timeline:scroll(root block)}}
}
@keyframes progx{to{transform:scaleX(1)}}

/* Borde con luz especular */
.tile,.week,.srow,.idea,.src,.takes,.surf{
  border-color:transparent;
  background:linear-gradient(180deg,var(--surface-hi),var(--surface)) padding-box,
    linear-gradient(155deg,rgba(255,240,224,.30),rgba(190,230,230,.05) 38%,rgba(255,131,64,.20)) border-box}
:root[data-theme="light"] .tile,:root[data-theme="light"] .week,:root[data-theme="light"] .srow,:root[data-theme="light"] .idea,:root[data-theme="light"] .src,:root[data-theme="light"] .takes,:root[data-theme="light"] .surf{
  background:linear-gradient(180deg,var(--surface-hi),var(--surface)) padding-box,
    linear-gradient(155deg,rgba(255,255,255,.95),rgba(40,28,10,.10) 45%,rgba(201,70,26,.30)) border-box}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .tile,:root:not([data-theme="dark"]) .week,:root:not([data-theme="dark"]) .srow,:root:not([data-theme="dark"]) .idea,:root:not([data-theme="dark"]) .src,:root:not([data-theme="dark"]) .takes,:root:not([data-theme="dark"]) .surf{
    background:linear-gradient(180deg,var(--surface-hi),var(--surface)) padding-box,
      linear-gradient(155deg,rgba(255,255,255,.95),rgba(40,28,10,.10) 45%,rgba(201,70,26,.30)) border-box}
}
.idea.chosen{background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box,linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(155deg,var(--accent-text),var(--accent)) border-box}

/* Resplandor tungsteno */
.nav .ind{box-shadow:0 8px 26px -6px rgba(255,131,64,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.track .bx{box-shadow:0 8px 26px -8px rgba(255,131,64,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary,.btn.pri{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 26px -12px rgba(255,131,64,.7)}
.tg i.on{box-shadow:0 0 12px rgba(255,131,64,.65)}
.segs i.on{box-shadow:0 0 10px rgba(255,131,64,.5)}
.take input:checked + .box,.task input:checked + .box{animation:ring .7s var(--ease) both}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,131,64,.6)}100%{box-shadow:0 0 0 12px rgba(255,131,64,0)}}

/* Presión con peso: se hunden y vuelven con muelle */
.tile,.beat,.src,.week,.idea{transition:transform .55s var(--spring),border-color .2s}
.tile:active,.beat:active,.src:active{transform:scale(.972);transition-duration:.1s}

/* Claqueta: timecode y luz de grabación */
.board .tcrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tc{display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;color:rgba(244,239,230,.78)}
.rec{width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 10px var(--rose)}
@media (prefers-reduced-motion:no-preference){.rec{animation:rec 1.6s ease-in-out infinite}}
@keyframes rec{0%,55%{opacity:1}70%,100%{opacity:.25}}

/* Destello anamórfico que cruza la siguiente toma */
@media (prefers-reduced-motion:no-preference){
  .next{animation:flare 8s cubic-bezier(.5,0,.2,1) 1.4s infinite}
}
@keyframes flare{0%,62%{background-position:-140% 0,0 0}100%{background-position:240% 0,0 0}}

/* Destello de cámara */
.flash{position:fixed;inset:0;z-index:92;pointer-events:none;opacity:0;
  background:radial-gradient(70% 55% at 50% 42%,rgba(255,244,230,.9),rgba(255,160,90,.35) 60%,transparent 100%);mix-blend-mode:screen}

/* Cortina de arranque */
.curtain{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:14px;pointer-events:none;
  background:radial-gradient(90% 70% at 50% 45%,#0B1A1E,#020507);color:var(--paper);
  animation:curtain 1.25s cubic-bezier(.7,0,.2,1) .15s both}
.cw{font:900 clamp(3.4rem,20vw,7rem)/.85 var(--f-display);text-transform:uppercase;letter-spacing:.01em;
  animation:cwin 1s cubic-bezier(.16,1,.3,1) both}
.cl2{display:block;height:2px;width:min(46vw,220px);background:linear-gradient(90deg,var(--teal),var(--ember),var(--gold));transform-origin:0 50%;
  animation:cline .9s cubic-bezier(.7,0,.2,1) .1s both}
.cs{font:500 .72rem var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(244,239,230,.55);animation:cwin 1s .1s both}
@keyframes cwin{from{opacity:0;transform:translateY(14px) scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes cline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes curtain{0%,62%{opacity:1;clip-path:inset(0 0 0 0)}99%{opacity:1;clip-path:inset(0 0 100% 0)}100%{opacity:0;clip-path:inset(0 0 100% 0);visibility:hidden}}
@media (prefers-reduced-motion:reduce){.curtain{display:none}.flash{display:none}}

/* Puntuación de ideas */
.score{border-top:1px solid var(--line-soft);padding-top:8px}
.score summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.score summary::-webkit-details-marker{display:none}
.sc-n{font:900 2.1rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.sc-n i{font-style:normal;font-size:1rem;color:var(--muted)}
.sc-v{font:600 .72rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sc-v.ok{color:var(--c-blue)}.sc-v.low{color:var(--c-red)}
.sc-top{margin-left:auto;font:900 .9rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;padding:4px 9px 3px;border-radius:6px;
  background:var(--accent);color:var(--accent-ink)}
.score summary::after{content:"";width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:6px;transition:transform .35s var(--spring)}
.sc-top + *{}
.score[open] summary::after{transform:rotate(-135deg)}
.facs{display:grid;gap:10px;padding:6px 0 4px}
.fac{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.ft b{display:block;font:650 .93rem/1.25 var(--f-body)}
.ft span{display:block;color:var(--muted);font-size:.8rem;line-height:1.35}
.f3{display:flex;gap:4px}
.f3 button{width:40px;min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font:700 .95rem var(--f-mono);color:var(--muted)}
.f3 button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 20px -10px rgba(255,131,64,.7)}
.ainote{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--accent-soft);font-size:.9rem;line-height:1.4}
.ainote b{font:600 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);margin-right:6px}
.btn[disabled]{opacity:.55;pointer-events:none}
.hkbox{display:grid;gap:2px;margin-top:8px;padding-top:12px;border-top:1px dashed var(--line)}
.hkbox > b{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text)}
.hkbox em{font-style:normal;color:var(--muted)}
.hk{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:0;background:none;padding:8px 0;min-height:44px;font-size:.92rem;line-height:1.35}
.hkb{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);position:relative;transition:background-color .15s,border-color .15s}
.hkb::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .22s var(--ease)}
.hk[aria-pressed="true"] .hkb{background:var(--accent);border-color:var(--accent)}
.hk[aria-pressed="true"] .hkb::after{transform:rotate(45deg) scale(1)}
.hk[aria-pressed="true"] span:last-child{color:var(--muted)}

/* Diario */
.streak-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin-top:22px;padding:20px 22px;border-radius:var(--r);
  background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box,linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(155deg,var(--accent-text),var(--accent)) border-box;border:1px solid transparent}
.sk-n{font:900 clamp(5rem,26vw,8rem)/.78 var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent-text)}
.streak-card b{display:block;font:800 1.5rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.streak-card span{display:block;color:var(--muted);font-size:.92rem;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.stat b{display:block;font:900 2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font:500 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.strk{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin-top:12px;padding:12px 16px;text-align:left;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.strk-n{font:900 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent-text);min-width:1.4ch;text-align:center}
.strk b{display:block;font:700 1rem/1.2 var(--f-body)}
.strk span span{display:block;color:var(--muted);font-size:.86rem}
.strk-go{font-size:1.6rem;color:var(--muted)}
.pub{display:grid;gap:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.pub-t{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pub-t b{font:700 1.05rem/1.3 var(--f-body)}
.pub-d{font:500 .74rem var(--f-mono);color:var(--muted);white-space:nowrap}
.pub-u{font:500 .8rem var(--f-mono);overflow-wrap:anywhere}
.mx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mx label{display:grid;gap:4px;font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mx input{min-height:44px;text-align:center;font:700 1rem var(--f-mono);font-variant-numeric:tabular-nums;padding:6px}

.times{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tmr{display:inline-flex;align-items:center;gap:2px;padding:2px 4px 2px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);
  font:600 .85rem var(--f-mono);font-variant-numeric:tabular-nums}
.tmr.ok{color:var(--c-blue);border-color:var(--c-blue)}
.tmr.off{color:var(--c-red);border-color:var(--c-red)}
.tmr button{min-width:36px;min-height:36px;border:0;background:none;color:inherit;font-size:1.1rem;opacity:.7}
.heat{padding-top:6px}

.ptypes{display:grid;gap:2px;margin-top:6px}
.ptype{border-top:1px solid var(--line-soft);padding:12px 0}
.ptype:first-child{border-top:0}
.ptype b{font-weight:650}

@media (prefers-reduced-motion:reduce){
  button,.topbar,.box,.box::after,.take::after,.bn,.segs i{transition:none}
  button:active{transform:none}
  .tg i.on,.segs i.on,.stamp{animation:none}
}

</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Secciones">
    <span class="ind" id="navInd" aria-hidden="true"></span>
    <div class="brand">Sofrito<small></small></div>
    <button type="button" data-tab="inicio">Inicio</button>
    <button type="button" data-tab="teoria">Teoría</button>
    <button type="button" data-tab="hacer">Hacer</button>
    <button type="button" data-tab="escribir">Crear</button>
    <button type="button" data-tab="diario">Diario</button>
  </nav>
  <main class="main" id="main">
    <section id="p-inicio" class="panel" hidden></section>
    <section id="p-teoria" class="panel" hidden></section>
    <section id="p-hacer" class="panel" hidden></section>
    <section id="p-escribir" class="panel" hidden></section>
    <section id="p-diario" class="panel" hidden></section>
    <section id="p-conectar" class="panel" hidden></section>
  </main>
</div>

<div class="leaks" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="vig" aria-hidden="true"></div>
<div class="prog" aria-hidden="true"></div>
<div class="grain" id="grain" aria-hidden="true"></div>
<div class="curtain" aria-hidden="true"><span class="cw">Sofrito</span><span class="cl2"></span><span class="cs">Escena 1 · Toma 1</span></div>
<div class="topbar" id="topbar" aria-hidden="true"><span id="topTitle">Hoja de ruta</span></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab" id="sheetGrab"><span class="handle" aria-hidden="true"></span><h3 id="sheetTitle">Nueva idea</h3></div>
  <div class="form">
    <div class="field wide"><label for="sh-text">Algo que te pasó, te costó o decidiste</label>
      <input type="text" id="sh-text" autocomplete="off" placeholder="Una situación concreta, no un consejo"></div>
    <div class="field wide"><label for="sh-why">Qué debería sentir o llevarse quien la vea</label>
      <input type="text" id="sh-why" autocomplete="off" placeholder="Aprendizaje, ganas de compartir, risa"></div>
  </div>
  <div class="tools"><button type="button" class="btn primary" data-act="sheet-save">Añadir idea</button>
    <button type="button" class="btn quiet" data-act="sheet-close">Cancelar</button></div>
</div>
<div class="sync" id="sync" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";

/* ---------- Contenido: llega del repo privado y se guarda en el dispositivo ---------- */
var IDS={},VIDEOS=[],PHASES=[],WEEKS=[],ROWTYPES={},ROWORDER=[],TXT={},GUION={campos:[],leyenda:[],inicio:[]},SEED={ideas:[],plan:{}};
var CONTENT=null;
function applyContent(c){
  CONTENT=c;
  IDS={};
  VIDEOS=(c.videos||[]).map(function(v){IDS[v.key]=v.id;return [v.key,v.titulo];});
  PHASES=c.fases||[];
  WEEKS=c.semanas||[];
  GUION=c.guion||GUION;
  ROWTYPES=GUION.tipos||{};
  ROWORDER=GUION.orden||Object.keys(ROWTYPES);
  TXT=c.textos||{};
  SEED=c.defaults||SEED;
  var sub=document.querySelector(".brand small");
  if(sub)sub.textContent=TXT.marca_sub||"";
}
function T(k){return TXT[k]||"";}

/* ---------- Estado: tus datos (se sincronizan con datos.json del repo privado) ---------- */
var KEY="sofrito-datos-v1",CKEY="sofrito-contenido-v1",NKEY="sofrito-conexion-v1",PKEY="sofrito-pendiente-v1",UKEY="sofrito-ui-v1";
var seq=1;
function newRow(type){return {id:"r"+(seq++),type:type,text:""};}
function newScript(){
  var ini=(GUION.inicio&&GUION.inicio.length)?GUION.inicio:ROWORDER.slice(0,1);
  return {title:"",dur:GUION.duracion||"",emo:"",hook:"",need:"",cta:"",you:"",
    rows:ini.map(function(t){return newRow(t);})};
}
function defaults(){
  var pl=SEED.plan||{};
  return {
    ui:{tab:"inicio",phase:1,sub:"ideas",video:1},
    checks:{},
    weeks:{},
    ideas:JSON.parse(JSON.stringify(SEED.ideas||[])),
    scripts:{1:newScript(),2:newScript()},
    days:{},
    pubs:[],
    push:{prefs:{hour:19,types:{recordatorio:true,racha:true,motivacion:true}},subs:{}},
    plan:{angulo:pl.angulo||"",serie:pl.serie||"",objetivo:pl.objetivo||""},
    updatedAt:0
  };
}
function loadJSON(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function putJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function recalcSeq(){
  var mx=0;
  [1,2].forEach(function(v){((S.scripts[v]||{}).rows||[]).forEach(function(r){var n=parseInt(String(r.id).slice(1),10);if(n>mx)mx=n;});});
  seq=mx+1;
}
function mergeData(o){
  ["checks","weeks","ideas","scripts","plan","days","pubs","push"].forEach(function(k){if(o&&o[k]!==undefined)S[k]=o[k];});
  S.updatedAt=(o&&o.updatedAt)||0;
  [1,2].forEach(function(v){if(!S.scripts[v])S.scripts[v]=newScript();});
  recalcSeq();
}
function payload(){return {checks:S.checks,weeks:S.weeks,ideas:S.ideas,scripts:S.scripts,plan:S.plan,days:S.days,pubs:S.pubs,push:S.push};}

var CONN=loadJSON(NKEY);
var _cc=loadJSON(CKEY);
if(_cc)applyContent(_cc);
var S=defaults();
(function(){var cd=loadJSON(KEY);if(cd)mergeData(cd);var u=loadJSON(UKEY);if(u&&typeof u==="object")S.ui=Object.assign(S.ui,u);})();
var lastHash=JSON.stringify(payload());

/* ---------- Guardado local y en GitHub ---------- */
var saveTimer=0,pushTimer=0,remoteSha=null,pushing=false,curStatus="idle",statTimer=0;
var STAT_TXT={idle:"",syncing:"Sincronizando…",saving:"Guardando…",pending:"Cambios pendientes de guardar",saved:"Guardado",
  offline:"Sin conexión: se guardará al volver",auth:"Token no válido o caducado",nocontent:"No encuentro contenido.json en el repo"};
function statusText(){return STAT_TXT[curStatus]||"";}
function setStatus(s){
  curStatus=s;
  var el=document.getElementById("sync");
  if(el){
    clearTimeout(statTimer);
    el.textContent=STAT_TXT[s]||"";
    var on=!(s==="idle");
    var bad=(s==="auth"||s==="nocontent"||s==="offline");
    el.className="sync"+(on?" on":"")+(bad?" bad":"");
    if(s==="saved")statTimer=setTimeout(function(){el.classList.remove("on");},1600);
  }
  var cs=document.getElementById("connState");
  if(cs)cs.textContent=STAT_TXT[s]||"";
}
function b64enc(s){var b=new TextEncoder().encode(s),r="",i;for(i=0;i<b.length;i++)r+=String.fromCharCode(b[i]);return btoa(r);}
function b64dec(s){var r=atob(String(s).replace(/\s/g,"")),b=new Uint8Array(r.length),i;for(i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return new TextDecoder().decode(b);}
function ghHeaders(){return {"Authorization":"Bearer "+CONN.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};}
function ghUrl(p){return (CONN.api||"https://api.github.com")+"/repos/"+CONN.repo+"/contents/"+p;}
function ghGet(p){
  return fetch(ghUrl(p),{headers:ghHeaders(),cache:"no-store"}).then(function(r){
    if(r.status===404)return null;
    if(!r.ok){var e=new Error("http "+r.status);e.status=r.status;throw e;}
    return r.json();
  });
}
function ghPut(p,text,sha,msg){
  var body={message:msg,content:b64enc(text)};
  if(sha)body.sha=sha;
  var h=ghHeaders();h["Content-Type"]="application/json";
  return fetch(ghUrl(p),{method:"PUT",headers:h,body:JSON.stringify(body)}).then(function(r){
    if(!r.ok){var e=new Error("http "+r.status);e.status=r.status;throw e;}
    return r.json();
  });
}
/* Lanza el workflow "Valorar" del repo privado. Necesita permiso Actions en el token; si falta, lo hará el cron. */
var aiWant=false;
function dispatchValorar(){
  var h=ghHeaders();h["Content-Type"]="application/json";
  fetch((CONN.api||"https://api.github.com")+"/repos/"+CONN.repo+"/actions/workflows/valorar.yml/dispatches",
    {method:"POST",headers:h,body:JSON.stringify({ref:CONN.ref||"main"})}).then(function(r){
    if(!r.ok)toast("Valoración en cola. Se hará sola en un par de horas");
  }).catch(function(){});
}
function persist(){
  var h=JSON.stringify(payload());
  putJSON(UKEY,S.ui);
  if(h!==lastHash){
    lastHash=h;
    S.updatedAt=Date.now();
    putJSON(KEY,Object.assign({updatedAt:S.updatedAt},payload()));
    if(CONN){try{localStorage.setItem(PKEY,"1");}catch(e){}schedulePush();}
  }
}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,150);}
function schedulePush(){clearTimeout(pushTimer);setStatus("pending");pushTimer=setTimeout(push,1800);}
function push(){
  if(!CONN||pushing)return;
  pushing=true;setStatus("saving");
  var sent=JSON.stringify(payload());
  var text=JSON.stringify(Object.assign({updatedAt:S.updatedAt},payload()),null,1);
  var msg="Sofrito: guardado "+new Date().toISOString().slice(0,16).replace("T"," ");
  var attempt=function(sha){return ghPut("datos.json",text,sha,msg);};
  var first=remoteSha?Promise.resolve(remoteSha):ghGet("datos.json").then(function(d){return d?d.sha:null;});
  first.then(function(sha){
    return attempt(sha).catch(function(e){
      if(e.status===409||e.status===422){return ghGet("datos.json").then(function(d){return attempt(d?d.sha:null);});}
      throw e;
    });
  }).then(function(res){
    remoteSha=res.content.sha;
    pushing=false;
    if(aiWant){aiWant=false;dispatchValorar();}
    if(JSON.stringify(payload())===sent){try{localStorage.removeItem(PKEY);}catch(e){}setStatus("saved");}
    else schedulePush();
  }).catch(function(e){
    pushing=false;
    setStatus((e.status===401||e.status===403)?"auth":"offline");
  });
}
/* Descarga contenido y datos del repo privado. Devuelve "ok" o el código de error. */
function sync(){
  if(!CONN)return Promise.resolve("noconn");
  setStatus("syncing");
  return Promise.all([ghGet("contenido.json"),ghGet("datos.json")]).then(function(r){
    var c=r[0],d=r[1],changed=false,pending=!!localStorage.getItem(PKEY);
    if(!c){var e=new Error("sin contenido");e.status=404;e.what="contenido";throw e;}
    var text=b64dec(c.content),prev=null;
    try{prev=localStorage.getItem(CKEY);}catch(x){}
    if(text!==prev){
      var obj=JSON.parse(text);
      try{localStorage.setItem(CKEY,text);}catch(x){}
      applyContent(obj);changed=true;
      /* Dispositivo recién conectado sin datos propios: arrancar con las ideas y el plan de base */
      if(S.updatedAt===0&&!pending){var ui0=S.ui;S=defaults();S.ui=ui0;recalcSeq();lastHash=JSON.stringify(payload());}
    }
    if(d){
      remoteSha=d.sha;
      var remote=JSON.parse(b64dec(d.content));
      if(!pending&&(remote.updatedAt||0)>S.updatedAt){
        mergeData(remote);
        putJSON(KEY,Object.assign({updatedAt:S.updatedAt},payload()));
        lastHash=JSON.stringify(payload());
        changed=true;
      }else if(pending||S.updatedAt>(remote.updatedAt||0)){schedulePush();}
    }else{
      remoteSha=null;
      try{localStorage.setItem(PKEY,"1");}catch(x){}
      schedulePush();
    }
    if(curStatus==="syncing")setStatus("saved");
    if(changed)rerender();
    return "ok";
  }).catch(function(e){
    var s=(e.status===401||e.status===403)?"auth":(e.what==="contenido"?"nocontent":"offline");
    setStatus(s);
    return s;
  });
}
function rerender(){
  var cn=document.getElementById("p-conectar");
  if(cn&&!cn.hidden&&CONTENT&&PHASES.length){
    var nv=document.getElementById("nav");if(nv)nv.hidden=false;
    S.ui.tab="inicio";show("inicio",true,0);placeNav(true);
    return;
  }
  var a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if(!CONTENT||!PHASES.length)return;
  if(!VIEWS[S.ui.tab])S.ui.tab="inicio";
  if(!phaseById(S.ui.phase))S.ui.phase=PHASES[0].id;
  renderTab(S.ui.tab);
}


/* ---------- Utilidades ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function rich(s){
  return s.replace(/\{([A-Z]) (\d+:\d\d)\}/g,function(m,v,t){
    if(!IDS[v])return m;
    var p=t.split(":"),sec=parseInt(p[0],10)*60+parseInt(p[1],10);
    return '<a class="ts" href="https://www.youtube.com/watch?v='+IDS[v]+'&amp;t='+sec+'s" target="_blank" rel="noopener">'+v+' '+t+'</a>';
  });
}
function phaseById(id){return PHASES.filter(function(p){return p.id===id;})[0];}
function ckey(p,i){return "f"+p+"-"+i;}
function phaseDone(p){var n=0;phaseById(p).todo.forEach(function(_,i){if(S.checks[ckey(p,i)])n++;});return n;}
function phaseTotal(p){return phaseById(p).todo.length;}
function allDone(){var n=0;PHASES.forEach(function(p){n+=phaseDone(p.id);});return n;}
function allTotal(){var n=0;PHASES.forEach(function(p){n+=p.todo.length;});return n;}
function fracText(p){return phaseDone(p)+"/"+phaseTotal(p);}

/* ---------- Conexión con el repo privado ---------- */
function connPanel(){
  var h='<div class="sect"><h3>Conexión y copia</h3>';
  h+='<p class="fine" style="margin-top:0">'+(CONN?'Conectada al repositorio <b>'+esc(CONN.repo)+'</b>. Estado: <span id="connState">'+esc(statusText()||"al día")+'</span>.':'Sin conexión configurada.')+'</p>';
  h+='<div class="tools">';
  if(CONN)h+='<button type="button" class="btn" data-act="sync-now">Sincronizar ahora</button>';
  h+='<button type="button" class="btn" data-act="copy-data">Copiar mis datos</button>'+
     '<button type="button" class="btn" data-act="restore-open">Restaurar desde texto</button></div>';
  h+='<div class="fallback" id="restoreBox" hidden><label class="msg" for="restoreText">Texto de tus datos:</label>'+
     '<textarea id="restoreText" style="min-height:120px;overflow:auto;font-family:var(--f-mono);font-size:.85rem"></textarea>'+
     '<div class="tools"><button type="button" class="btn primary" data-act="restore-do">Restaurar</button><span class="msg" id="restoreMsg" role="status"></span></div></div>';
  h+='<div class="tools"><button type="button" class="btn quiet" data-act="disconnect">Desconectar y borrar de este dispositivo</button></div></div>';
  return h;
}
function vConectar(msg){
  return '<header class="panel-head"><h2 class="big-h">Sofrito</h2>'+
    '<p>Esta app guarda su contenido y tus datos en un repositorio privado tuyo de GitHub. Conéctala una vez en este dispositivo.</p></header>'+
    '<div class="form">'+
    '<div class="field wide"><label for="cn-repo">Repositorio privado (usuario/nombre)</label>'+
    '<input type="text" id="cn-repo" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="tuusuario/sofrito-datos"></div>'+
    '<div class="field wide"><label for="cn-token">Token de acceso</label>'+
    '<input type="password" id="cn-token" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_..."></div></div>'+
    '<div class="tools"><button type="button" class="btn primary" data-act="connect">Conectar</button>'+
    '<span class="msg" id="cnMsg" role="status">'+esc(msg||"")+'</span></div>'+
    '<p class="fine">El token se guarda solo en este dispositivo y solo da acceso a ese repositorio. Si pierdes el móvil, lo revocas desde GitHub.</p>';
}
function showConnect(msg){
  $$("#main > section").forEach(function(s){s.hidden=(s.id!=="p-conectar");});
  var nav=$("#nav");if(nav)nav.hidden=true;
  var tb=$("#topbar");if(tb)tb.classList.remove("on");
  var el=$("#p-conectar");
  el.innerHTML=vConectar(msg);
  anim(el,[{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:SP_UI.ms,easing:ease(SP_UI)});
  revealTitles(el);
}
function connectNow(){
  var repo=($("#cn-repo").value||"").trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,"");
  var tok=($("#cn-token").value||"").trim();
  var msg=$("#cnMsg");
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){msg.textContent="Escribe el repositorio como usuario/nombre.";return;}
  if(!tok){msg.textContent="Pega el token de acceso.";return;}
  CONN={repo:repo,token:tok};
  msg.textContent="Conectando…";
  sync().then(function(r){
    if(r==="ok"&&CONTENT){
      putJSON(NKEY,CONN);
      var nav=$("#nav");if(nav)nav.hidden=false;
      S.ui.tab="inicio";
      show("inicio",true,0);
      placeNav(true);
    }else{
      CONN=null;
      var m=r==="auth"?"El token no es válido o no tiene acceso a ese repositorio."
        :r==="nocontent"?"Conecta bien, pero no encuentro contenido.json en la raíz del repositorio."
        :"No he podido conectar. Revisa el nombre del repositorio y la conexión.";
      var el=$("#cnMsg");if(el)el.textContent=m;
    }
  });

/* ---------- Movimiento: muelles (damping + response, como Apple) ---------- */
var RM=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);

/* Muelle como curva CSS linear(): sirve para WAAPI y transiciones. Mismo muelle en toda la app. */
function makeSpring(damping,response){
  var w=2*Math.PI/response,dt=1/120,settle=0,t,i,pts=[];
  function f(t){
    if(damping>=1)return 1-(1+w*t)*Math.exp(-w*t);

    return 1-Math.exp(-z*t)*(Math.cos(wd*t)+(z/wd)*Math.sin(wd*t));
  }
  for(t=0;t<4;t+=dt){if(Math.abs(1-f(t))>0.002)settle=t;}
  settle+=dt;
  var n=Math.min(56,Math.max(8,Math.ceil(settle*60)));
  for(i=0;i<=n;i++)pts.push(+f(settle*i/n).toFixed(4));
  pts[n]=1;
  return {css:"linear("+pts.join(",")+")",ms:Math.round(settle*1000)};
}
var LIN_OK=!!(window.CSS&&CSS.supports&&CSS.supports("animation-timing-function","linear(0,1)"));
var SP_UI=makeSpring(1,.38);      /* sin rebote: entradas y cambios de estado */

function anim(el,frames,opt){if(RM||!el||!el.animate)return null;return el.animate(frames,opt);}

/* Muelle interrumpible: se puede redirigir en pleno vuelo y conserva la velocidad. */
function Spring(v,damping,response,on){

Spring.prototype.stop=function(){if(this.raf){cancelAnimationFrame(this.raf);this.raf=0;}};

  if(RM){s.stop();s.v=target;s.vel=0;s.on(target);var d0=s.done;s.done=null;if(d0)d0();return;}
  if(s.raf)return;
  var last=performance.now();

    var dt=Math.min((now-last)/1000,1/30),n,h,i,a;
    last=now;
    n=Math.max(1,Math.ceil(dt*240));h=dt/n;
    for(i=0;i<n;i++){a=-s.k*(s.v-s.t)-s.c*s.vel;s.vel+=a*h;s.v+=s.vel*h;}
    if(Math.abs(s.v-s.t)<0.05&&Math.abs(s.vel)<2){

/* Caja que se transforma de un elemento a otro (píldora de pestañas, chips, segmentados) */

function burst(x,y,n,reach){

/* ---------- Hoja inferior (bottom sheet) ---------- */
var sheet=$("#sheet"),scrim=$("#scrim"),mainEl=$("#main");
var sheetY=0,sheetH=0,sheetOpen=false,lastFocus=null,sdrag=null;
var sheetSpring=new Spring(0,.86,.44,function(y){
  sheetY=y;
  sheet.style.transform="translateY("+y+"px)";
  var p=sheetH?Math.max(0,Math.min(1,1-y/sheetH)):0;
  scrim.style.opacity=p;
  mainEl.style.transform=p>0.001?"scale("+(1-.05*p)+")":"";
});
function setInert(on){[mainEl,$("#nav"),$("#topbar")].forEach(function(n){if(n)n.inert=on;});}
function openSheet(){
  lastFocus=document.activeElement;
  scrim.hidden=false;sheet.hidden=false;
  sheetH=sheet.offsetHeight||380;
  mainEl.style.transformOrigin="50% 0";
  sheetSpring.set(sheetH);
  sheetOpen=true;setInert(true);
  sheetSpring.to(0,0);
  setTimeout(function(){var f=$("#sh-text");if(f)f.focus({preventScroll:true});},120);
}
function closeSheet(vel){
  if(!sheetOpen)return;
  sheetOpen=false;
  sheetSpring.to(sheetH,vel||0,function(){
    sheet.hidden=true;scrim.hidden=true;mainEl.style.transform="";setInert(false);
    if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
  });
}
function saveIdea(){
  var tx=$("#sh-text"),wy=$("#sh-why");
  if(!tx.value.trim()){tx.focus();shake(tx);return;}
  var id="i"+Date.now();
  S.ideas.unshift({id:id,text:tx.value.trim(),why:wy.value.trim(),chosen:false});
  mark(1);save();tx.value="";wy.value="";
  closeSheet(0);
  renderTab("escribir");
  var n=$('.idea[data-id="'+id+'"]');
  anim(n,[{opacity:0,transform:"scale(.9)"},{opacity:1,transform:"scale(1)"}],{duration:SP_POP.ms,easing:ease(SP_POP),delay:120,fill:"backwards"});
  toast("Idea añadida");
}
$("#sheetGrab").addEventListener("pointerdown",function(e){
  if(!sheetOpen||e.button>0)return;
  sheetSpring.stop();                      /* agarrar la hoja en pleno vuelo la interrumpe */
  sdrag={id:e.pointerId,y0:e.clientY,base:sheetY,hist:[]};
  pushHist(sdrag.hist,e.timeStamp,e.clientY);
  this.setPointerCapture(e.pointerId);
});
$("#sheetGrab").addEventListener("pointermove",function(e){
  if(!sdrag||e.pointerId!==sdrag.id)return;
  var y=sdrag.base+(e.clientY-sdrag.y0);
  if(y<0)y=-rubber(-y,sheetH*.6);        /* resistencia hacia arriba */
  pushHist(sdrag.hist,e.timeStamp,e.clientY);
  sheetSpring.set(y);
});
function endSheetDrag(){
  if(!sdrag)return;
  var v=velocity(sdrag.hist),proj=sheetY+project(v);
  sdrag=null;
  if(proj>sheetH*.55||(v>900&&sheetY>20))closeSheet(v);
  else sheetSpring.to(0,v);
}
$("#sheetGrab").addEventListener("pointerup",endSheetDrag);
$("#sheetGrab").addEventListener("pointercancel",endSheetDrag);
scrim.addEventListener("click",function(){closeSheet(0);});
document.addEventListener("keydown",function(e){
  if(!sheetOpen)return;
  if(e.key==="Escape"){closeSheet(0);return;}
  if(e.key==="Tab"){
    var f=$$("input,button,textarea",sheet).filter(function(n){return !n.disabled;});
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
  }
});

/* ---------- Deslizar entre fases (arrastre 1:1, momento y resistencia en los extremos) ---------- */
var sw=null;
document.addEventListener("pointerdown",function(e){
  if(e.pointerType==="mouse"||e.button>0||sheetOpen)return;
  var el=e.target.closest(".swipe");
  if(!el||e.target.closest("input,textarea,select"))return;
  sw={el:el,id:e.pointerId,x0:e.clientX,y0:e.clientY,x:0,lock:false,hist:[],w:Math.max(el.offsetWidth,240)};
  pushHist(sw.hist,e.timeStamp,e.clientX);
});
document.addEventListener("pointermove",function(e){
  if(!sw||e.pointerId!==sw.id)return;
  var dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.lock){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){sw.lock=true;try{sw.el.setPointerCapture(e.pointerId);}catch(err){}sw.el.classList.add("dragging");}
    else if(Math.abs(dy)>10){sw=null;return;}
    else return;
  }
  var ph=S.ui.phase,x=dx;
  if((dx>0&&ph<=1)||(dx<0&&ph>=PHASES.length))x=rubber(dx,sw.w);
  sw.x=x;
  pushHist(sw.hist,e.timeStamp,e.clientX);
  sw.el.style.transform="translateX("+x+"px)";
  sw.el.style.opacity=String(1-Math.min(Math.abs(x)/sw.w,.6)*.7);
});
function endSwipe(cancel){
  var s=sw;sw=null;
  if(!s||!s.lock)return;
  var el=s.el;
  el.classList.remove("dragging");
  var v=cancel?0:velocity(s.hist),proj=s.x+project(v),W=s.w,ph=S.ui.phase,dir=0;
  if(!cancel){
    if(proj<-W*.3&&ph<PHASES.length)dir=1;
    else if(proj>W*.3&&ph>1)dir=-1;
  }
  var sp=new Spring(s.x,dir?1:.8,dir?.3:.4,function(x){
    el.style.transform="translateX("+x+"px)";
    el.style.opacity=String(1-Math.min(Math.abs(x)/W,.6)*.7);
  });
  if(dir){sp.to(-dir*W*1.1,v,function(){setPhase(ph+dir,dir);});}
  else{sp.to(0,v,function(){el.style.transform="";el.style.opacity="";});}
}
document.addEventListener("pointerup",function(e){if(sw&&e.pointerId===sw.id)endSwipe(false);});
document.addEventListener("pointercancel",function(e){if(sw&&e.pointerId===sw.id)endSwipe(true);});

});

  if(t.dataset.f&&t.closest("#p-escribir")&&!t.dataset.row){curScript()[t.dataset.f]=t.value;save();}
});

/* Flechas para cambiar de fase con el teclado cuando el foco está en un chip */
document.addEventListener("keydown",function(e){
  if(sheetOpen||(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"))return;
  var c=document.activeElement;
  if(!c||!c.classList||!c.classList.contains("chip"))return;
  var n=S.ui.phase+(e.key==="ArrowRight"?1:-1);
  if(phaseById(n)){e.preventDefault();setPhase(n,e.key==="ArrowRight"?1:-1);}
});

window.addEventListener("resize",function(){placeNav(true);});
window.addEventListener("pagehide",function(){persist();});
/* Destello de cámara al cerrar una fase */
function flash(){
  if(RM)return;
  var f=document.createElement("i");
  f.className="flash";document.body.appendChild(f);
  var a=f.animate([{opacity:0},{opacity:.85,offset:.12},{opacity:0}],{duration:620,easing:"cubic-bezier(.2,.7,.2,1)"});
  a.onfinish=function(){f.remove();};
}
/* Timecode de la claqueta: 24 fotogramas por segundo */
(function(){
  var t0=performance.now(),last=-1,el=null;
  function p2(n){return n<10?"0"+n:""+n;}
  function loop(now){
    el=document.getElementById("tc");
    if(el&&!document.hidden){
      var fr=Math.floor((now-t0)/1000*24);
      if(fr!==last){
        last=fr;
        var f=fr%24,s=Math.floor(fr/24),m=Math.floor(s/60),h=Math.floor(m/60);
        el.textContent=p2(h)+":"+p2(m%60)+":"+p2(s%60)+":"+p2(f);
      }
    }
    requestAnimationFrame(loop);
  }
  if(!RM)requestAnimationFrame(loop);
})();


if(!VIEWS[S.ui.tab])S.ui.tab="inicio";
if(PHASES.length&&!phaseById(S.ui.phase))S.ui.phase=PHASES[0].id;
if(S.ui.sub!=="ideas"&&S.ui.sub!=="guion"&&S.ui.sub!=="plan")S.ui.sub="ideas";
if(S.ui.dsub!=="racha"&&S.ui.dsub!=="publicado")S.ui.dsub="racha";
if(S.ui.video!==1&&S.ui.video!==2)S.ui.video=1;
(function(){var hh=String(location.hash||"").replace("#","");if(VIEWS[hh]){S.ui.tab=hh;}})();
if("serviceWorker" in navigator){navigator.serviceWorker.addEventListener("message",function(e){var tb=e.data&&e.data.tab;if(tb&&VIEWS[tb])show(tb,true);});}
if(CONTENT&&PHASES.length){show(S.ui.tab,false,0);}else{showConnect();}
if(CONN){
  sync();
  window.addEventListener("online",function(){if(localStorage.getItem(PKEY))push();else sync();});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!pushing)sync();});
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){placeNav(true);});}
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
